<!DOCTYPE html><html><head>
<link rel="stylesheet" href="styles.css">
<link href="https://api.fontshare.com/v2/css?f[]=boska@400,700&f[]=satoshi@400,700&display=swap" rel="stylesheet">
</head><body>
<div class="phone">
  <!-- Screen: Home -->
  <div id="home" class="screen active">
    <small style="color:var(--primary);letter-spacing:2px;text-transform:uppercase">Sacred Path</small>
    <h1>Ancient wisdom<br>for modern love.</h1>
    <div class="card" onclick="show('weather')"><h3>Breathe Together</h3><p>Sync your rhythms.</p></div>
    <div class="card" onclick="show('weather')"><h3>Sacred Repair</h3><p>Bridge the distance.</p></div>
    <div class="card" onclick="show('weather')"><h3>Deepen Intimacy</h3><p>Embodied practice.</p></div>
  </div>

  <!-- Screen: Ritual -->
  <div id="ritual" class="screen">
    <small style="color:var(--primary)">SACRED VOICE</small>
    <h1>The Presence Reset</h1>
    <div class="card">1. Face each other for 60 seconds.</div>
    <div class="card">2. Share "Right now, I feel..."</div>
    <button class="btn" onclick="show('paywall')">Begin Ritual</button>
  </div>

  <div class="nav">
    <div onclick="show('home')">Home</div>
    <div onclick="show('ritual')">Rituals</div>
    <div onclick="show('paywall')">Pro</div>
  </div>
</div>
<script>
  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
</script>
</body></html>
